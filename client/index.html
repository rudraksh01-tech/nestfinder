<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NestFinder · AI Flat Finder for Bengaluru</title>
    <meta name="description" content="Describe how you live and NestFinder matches you to flats in Bengaluru, checks if the rent is fair and helps you decide." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta name="author" content="Rudra Pratap Singh" />
    <meta name="theme-color" content="#F4F3EE" />
    <!-- Apply a saved dark theme before the first paint, so the page never flashes light. -->
    <script>
      try {
        if (localStorage.getItem('nf_theme') === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
